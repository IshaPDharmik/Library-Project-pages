<!DOCTYPE html>
<html>
<head>
  <meta charset="ISO-8859-1">
  <title>LoginCard</title>
  <style>
 
    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100%;
    }


    .login-container {
      position: absolute; 
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-image: url('register img.jpeg');
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; 
      width: 100%;
    }

    .login-form {
      background-color: rgba(255, 255, 255, 0.8); 
      padding: 28px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      width: 400px;
    }

    .login-form h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 30px;
    }

    .login-form label {
      display: block;
      margin-bottom: 8px;
    }

    .login-form input, .login-form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .login-form textarea {
      resize: vertical;
    }

    .login-form button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .login-form a {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      display: inline-block;
      text-align: center;
      margin-top: 10px;
    }

    .login-form button:hover {
      background-color: #45a049;
    }

    .login-form a:hover {
      background-color: #45a049;
    }

  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-form">
      <h2>Login Page</h2>
      <form action="login" method="POST">
        <label for="e-mail"><b>E-mail Id:</b></label>
        <input type="text" id="e-mail" name="Email Id" required>

        <label for="password"><b>Password:</b></label>
        <input type="password" id="password" name="Password" required>

        <button type="submit"><b>Login</b></button><br><br>
         <a href="ForgetPage.html"><b>forget password</b></a> <br><br><br>
         <a href="RegisterPage.html"><b>Back</b></a> <br>
         
      </form>
    </div>
  </div>

</body>
</html>
